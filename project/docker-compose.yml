name: myproject

services:
  backend:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      postgres:
        restart: false
        condition: service_healthy
        required: true
    networks:
      - default
    restart: unless-stopped

  postgres:
    image: docker.io/postgres:17-alpine
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "pg_isready", "--dbname=app" ]
      interval: 10s
      timeout: 5s
      start_period: 5s
      start_interval: 2s
      retries: 5
    volumes:
      - type: volume
        source: data
        target: /var/lib/postgresql/data
        read_only: false

  pgadmin:
    image: docker.io/dpage/pgadmin4:9
    configs:
      - source: pgadmin_servers_config
        target: /pgadmin4/servers.json
    depends_on:
      postgres:
        restart: false
        condition: service_healthy
        required: true
    env_file:
      - path: ./infrastructure/configs/pgadmin/.env.template
        required: true
      - path: ./infrastructure/configs/pgadmin/.env
        required: false
    healthcheck:
      test: [ "CMD", "wget", "-O", "-", "http://localhost:80/misc/ping" ]
      interval: 10s
      timeout: 5s
      start_period: 5s
      start_interval: 2s
      retries: 5
    ports:
      - name: web
        target: 80
        published: 13641
        host_ip: 127.0.0.1
        protocol: tcp
        app_protocol: http
    networks:
      - default
    profiles:
      - observability
    restart: unless-stopped
    shm_size: 4mb
    volumes:
      - type: volume
        source: pgadmin_data
        target: /var/lib/pgadmin
        read_only: false

networks:
  default:
    driver: bridge
    name: $COMPOSE_PROJECT_NAME
    attachable: false
    enable_ipv4: true
    enable_ipv6: true
    internal: false


volumes:
  pgadmin_data:

